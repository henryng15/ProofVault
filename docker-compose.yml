services:
  postgres:
    image: postgres:16
    container_name: proofvault-postgres
    environment:
      POSTGRES_USER: proofvault
      POSTGRES_PASSWORD: proofvault
      POSTGRES_DB: proofvault
    ports:
      - "5432:5432"
    volumes:
      - proofvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofvault -d proofvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proofvault_pgdata:
